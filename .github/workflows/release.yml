name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags="-s -w -X main.Version=${VERSION}" \
            -o crom-pay-${GOOS}-${GOARCH}${EXT} ./cmd/crom-pay

      - name: Compress
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          BINARY="crom-pay-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          tar czf ${BINARY}.tar.gz ${BINARY}
          sha256sum ${BINARY}.tar.gz > ${BINARY}.tar.gz.sha256

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crom-pay-*.tar.gz
            crom-pay-*.sha256
          generate_release_notes: true
