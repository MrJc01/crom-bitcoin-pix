name: CI — Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verificar código
        run: go vet ./...

      - name: Testes unitários
        run: go test -v -race -count=1 ./internal/...

      - name: Testes de integração
        run: go test -v -tags integration -count=1 -timeout 120s ./tests/integration/...

      - name: Testes de segurança
        run: go test -v -tags security -count=1 -timeout 180s ./tests/security/...

      - name: Build
        run: go build -o bin/crom-pay ./cmd/crom-pay

      - name: Testes E2E
        run: bash tests/e2e/cli_test.sh

  build-matrix:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags="-s -w" -o bin/crom-pay-${GOOS}-${GOARCH}${EXT} ./cmd/crom-pay

      - uses: actions/upload-artifact@v4
        with:
          name: crom-pay-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/crom-pay-*
